<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSN Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fa;color:#172033}
header{background:#123d80;color:white;padding:22px 16px}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0}
.search{padding:15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
h2{padding:0 16px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.product{background:white;padding:12px;border-radius:14px;text-align:center}
.product img{width:100%;height:130px;object-fit:contain}
.price{font-weight:bold;color:#123d80}
button{background:#123d80;color:white;border:0;border-radius:9px;padding:11px;width:100%;font-size:14px}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>
<body>
<header>
<h1>HSN Shopping</h1>
<p>Welcome to your online shop</p>
</header>
<div class="search">
<input id="search" placeholder="Search products..." oninput="filterProducts()">
</div>
<h2>Our Products</h2>
<div class="products" id="products">
<div class="product">
<img src="https://placehold.co/300x200?text=Smartphone" alt="Smartphone">
<h3>Smartphone</h3>
<p class="price">€199.00</p>
<button onclick="addCart('Smartphone')">Add to Cart</button>
</div>
<div class="product">
<img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
<h3>Headphones</h3>
<p class="price">€29.00</p>
<button onclick="addCart('Headphones')">Add to Cart</button>
</div>
<div class="product">
<img src="https://placehold.co/300x200?text=Watch" alt="Watch">
<h3>Smart Watch</h3>
<p class="price">€49.00</p>
<button onclick="addCart('Smart Watch')">Add to Cart</button>
</div>
<div class="product">
<img src="https://placehold.co/300x200?text=Tablet" alt="Tablet">
<h3>Tablet</h3>
<p class="price">€99.00</p>
<button onclick="addCart('Tablet')">Add to Cart</button>
</div>
</div>
<footer>
<p id="cart">🛒 Cart: 0 items</p>
<p>© 2026 HSN Shopping</p>
</footer>
<script>
let count=0;
function addCart(name){
count++;
document.getElementById('cart').textContent='🛒 Cart: '+count+' items';
alert(name+' added to cart!');
}
function filterProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.product').forEach(p=>{
p.style.display=p.textContent.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
